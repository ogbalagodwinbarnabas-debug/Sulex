
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sulex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

  <!-- Main App Content Container -->
  <div id="mainAppSection">
    <!-- Header / Navbar placeholder if applicable -->
    
    <!-- Modal -->
    <div id="createModal" class="modal-overlay" style="display: none;">
      <div class="modal-sheet">
        <h3 style="font-size: 15px;">Create Post</h3>
        <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 10px;">Share media or articles with your network</p>
        
        <div class="create-type-selector">
          <button class="btn-modal-secondary" onclick="triggerFileUpload('image/*')">📷 Photo</button>
          <button class="btn-modal-secondary" onclick="triggerFileUpload('video/*')">🎥 Video</button>
          <button class="btn-modal-secondary" onclick="toggleArticleForm()">📝 Article</button>
        </div>

        <input type="file" id="mediaFileInput" style="display: none;" onchange="handleFileSelected(event)" />

        <div id="previewContainer" style="display: none; margin-bottom: 8px;">
          <div id="mediaPreview"></div>
        </div>

        <div id="articleForm" style="display: none; margin-bottom: 8px;">
          <input type="text" id="articleTitle" placeholder="Article Title..." style="margin-bottom: 6px;" />
          <textarea id="articleBody" rows="3" placeholder="Write full article body..."></textarea>
        </div>

        <div id="generalCaptionForm">
          <textarea id="postCaption" rows="3" placeholder="What's on your mind?"></textarea>
        </div>

        <button class="btn-primary-blue" style="margin-top: 10px;" onclick="handleCreatePost()">Publish</button>
        <button class="btn-modal-text" onclick="closeCreateModal()">Cancel</button>
      </div>
    </div>

  </div>

  <!-- Firebase App (compat core) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <!-- Firebase Auth (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <!-- Firebase Firestore (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAVmv4u7SqWSCu08rzM6banNAdrf1hOY3s",
      authDomain: "sulex-a6397.firebaseapp.com",
      projectId: "sulex-a6397",
      storageBucket: "sulex-a6397.firebasestorage.app",
      messagingSenderId: "1042396924109",
      appId: "1:1042396924109:web:5813e1e390a643d0a84184"
    };

    // Initialize Firebase Compat
    firebase.initializeApp(firebaseConfig);
  </script>
  <script src="app.js"></script>
</body>
</html>
